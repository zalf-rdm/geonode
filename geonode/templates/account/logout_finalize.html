{% extends "account/base.html" %}

{% load i18n %}

{% block title %}{% trans "Log out" %}{% endblock %}

{% block body_outer %}
<div class="row" style="margin-top: 40px;">
  <div class="col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2">
    <div class="panel panel-default" style="border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);">
      <div class="panel-body text-center" style="padding: 30px 40px;">
        <i class="fa fa-sign-out fa-3x text-muted" aria-hidden="true"></i>
        <h2 style="margin-top: 15px;">{% trans "Log out" %}</h2>
        <form id="global-logout-finalize-form" method="POST" action="{{ global_logout_action_url }}" style="margin-top: 20px;">
          {% csrf_token %}
          <button type="submit" class="btn btn-primary btn-block">{% trans "Log out" %}</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% if auto_submit %}<script>
  document.getElementById('global-logout-finalize-form').submit();
</script>{% endif %}
{% endblock body_outer %}
