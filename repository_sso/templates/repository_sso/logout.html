{% extends "account/base.html" %}
{% load i18n %}
{% block body_outer %}
<div style="max-width: 520px; margin: 40px auto; padding: 24px;">
  <h1>{% trans "Log out" %}</h1>
  <p>{% trans "This ends your session in the Repository and Upload Tool." %}</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary" style="min-height: 44px;">{% trans "Log out" %}</button>
    <a href="/" class="btn btn-link" style="min-height: 44px;">{% trans "Cancel" %}</a>
  </form>
</div>
{% endblock %}
