name: GeoNode Test Suites

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test Suites
    runs-on: ubuntu-24.04
    if: ${{ !github.event.pull_request.draft }}
    # The whole matrix runs in this one job. Generous, but a hung suite should not
    # burn the full 6h default.
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # diff-cover compares the coverage report against the merge base, so the full history has
          # to be present -- the default shallow clone has no origin/main to diff against.
          fetch-depth: 0

      - name: Build the stack images
        run: docker compose --env-file .env_test -f docker-compose-test.yml build --progress plain

      - name: Start the stack
        run: docker compose --env-file .env_test -f docker-compose-test.yml up -d

      - name: Wait for the django container to be responsive
        run: |
          DC="docker compose --env-file .env_test -f docker-compose-test.yml"
          for _ in $(seq 1 60); do
            if $DC exec -T django true </dev/null 2>/dev/null; then
              echo "django container is responsive"; exit 0
            fi
            sleep 5
          done
          echo "django container never became responsive"
          $DC ps
          exit 1

      # Deliberately ahead of the suites: these take seconds, and a missing dependency or an
      # un-generated migration should fail the job at ~6 minutes rather than ~50. They run inside the
      # django container because both need the full installed environment, which the image already
      # has -- no second build.
      - name: Check dependency declarations
        run: |
          DC="docker compose --env-file .env_test -f docker-compose-test.yml"
          $DC exec -T django bash -lc '
            cd /usr/src/geonode
            pip install --quiet deptry==0.25.1
            deptry . --no-ansi' </dev/null

      - name: Django system and migration checks
        run: |
          DC="docker compose --env-file .env_test -f docker-compose-test.yml"
          $DC exec -T django bash -lc '
            cd /usr/src/geonode
            set -a; . ./.env_test; set +a
            # UploadParallelismLimit.max_number defaults to a setting, so this check is only
            # deterministic with .env_test loaded -- see that app'"'"'s migration 0058.
            python manage.py makemigrations --check --dry-run
            # Default --fail-level is ERROR, so the security.W0xx warnings this test configuration
            # necessarily produces (DEBUG, no TLS) are reported without failing the build.
            python manage.py check --deploy' </dev/null

      - name: Prepare test databases and pristine templates
        # Django needs CREATE EXTENSION postgis, which requires superuser. Instead of granting
        # SUPERUSER to the geonode roles, the databases are pre-created here by postgres with the
        # extension installed and owned by the geonode roles.
        #
        # They are then migrated once and snapshotted as templates. Because every suite below runs
        # against the same stack, each one must start from a clean database -- otherwise state
        # left by an earlier suite leaks into the next (loading group_test_data.json fails with
        # "duplicate key ... username=admin" once a previous suite has created an admin). Restoring
        # from an already-migrated template resets in seconds instead of re-running ~450 migrations.
        run: |
          DC="docker compose --env-file .env_test -f docker-compose-test.yml"
          $DC exec -T db psql -U postgres -q -c "CREATE DATABASE test_geonode OWNER geonode;" </dev/null
          $DC exec -T db psql -U postgres -q -c "CREATE DATABASE test_geonode_data OWNER geonode_data;" </dev/null
          $DC exec -T db psql -U postgres -q -d test_geonode -c "CREATE EXTENSION IF NOT EXISTS postgis;" </dev/null
          $DC exec -T db psql -U postgres -q -d test_geonode_data -c "CREATE EXTENSION IF NOT EXISTS postgis;" </dev/null

          $DC exec -T django bash -lc '
            cd /usr/src/geonode
            set -a; . ./.env_test; set +a
            DATABASE_URL="postgis://geonode:geonode@db:5432/test_geonode" \
            GEODATABASE_URL="postgis://geonode_data:geonode_data@db:5432/test_geonode_data" \
            python manage.py migrate --noinput' </dev/null

          $DC exec -T db psql -U postgres -q -c \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname LIKE 'test_%';" </dev/null
          $DC exec -T db psql -U postgres -q -c "CREATE DATABASE test_geonode_pristine TEMPLATE test_geonode;" </dev/null
          $DC exec -T db psql -U postgres -q -c "CREATE DATABASE test_geonode_data_pristine TEMPLATE test_geonode_data;" </dev/null

      - name: Run all test suites sequentially
        id: suites
        run: |
          DC="docker compose --env-file .env_test -f docker-compose-test.yml"

          # tests/test.sh runs coverage in --parallel-mode, so each suite drops its own
          # .coverage.<host>.<pid>.<rand>. Clear any leftovers before the first one.
          $DC exec -T django bash -lc 'cd /usr/src/geonode && coverage erase' </dev/null

          reset_dbs() {
            $DC exec -T db psql -U postgres -q -c \
              "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname LIKE 'test_%';" </dev/null >/dev/null
            $DC exec -T db psql -U postgres -q -c "DROP DATABASE IF EXISTS test_geonode;" </dev/null
            $DC exec -T db psql -U postgres -q -c "DROP DATABASE IF EXISTS test_geonode_data;" </dev/null
            $DC exec -T db psql -U postgres -q -c \
              "CREATE DATABASE test_geonode TEMPLATE test_geonode_pristine OWNER geonode;" </dev/null
            $DC exec -T db psql -U postgres -q -c \
              "CREATE DATABASE test_geonode_data TEMPLATE test_geonode_data_pristine OWNER geonode_data;" </dev/null
          }

          # Resolved once so the suite table below contains no nested quoting.
          MAIN_TESTS=$($DC exec -T django bash -lc 'cd /usr/src/geonode && python tests/suite_apps.py main' </dev/null | tr -d '\r')
          SECURITY_TESTS=$($DC exec -T django bash -lc 'cd /usr/src/geonode && python tests/suite_apps.py security' </dev/null | tr -d '\r')
          GIS_TESTS=$($DC exec -T django bash -lc 'cd /usr/src/geonode && python tests/suite_apps.py gis_backend' </dev/null | tr -d '\r')

          # geonode.tests.test_load_thesaurus is listed explicitly: it lives in geonode/tests/ and is
          # not part of any GEONODE_APPS-derived selection, so nothing else would ever run it.
          # geonode.zalf likewise is attached via INSTALLED_APPS += (...), not GEONODE_APPS.
          SUITES=$(cat <<EOF
          Smoke|geonode.tests.smoke geonode.tests.test_rest_api geonode.tests.test_search geonode.tests.test_utils geonode.tests.test_headers geonode.tests.test_load_thesaurus
          ZALF|geonode.zalf
          Main|$MAIN_TESTS
          Security|$SECURITY_TESTS
          GIS Backend|$GIS_TESTS
          REST API|geonode.api.tests geonode.base.api.tests geonode.layers.api.tests geonode.maps.api.tests geonode.documents.api.tests geonode.geoapps.api.tests
          CSW|geonode.tests.csw geonode.catalogue.backends.tests
          Upload|geonode.upload
          EOF
          )

          FAILED=0
          SUMMARY=""
          while IFS='|' read -r NAME APPS; do
            NAME=$(echo "$NAME" | sed 's/^ *//;s/ *$//')
            [ -z "$NAME" ] && continue
            echo "::group::$NAME"
            START=$(date +%s)
            reset_dbs
            # </dev/null is essential: without it `docker compose exec -T` consumes the
            # here-document that feeds this while-loop and the remaining suites are skipped.
            #
            # timeout bounds each suite: a test that blocks on something that never arrives (an
            # async import waiting on a celery worker the test stack does not run, say) would
            # otherwise sit there until the job-level timeout and take every later suite with it.
            set +e
            # shellcheck disable=SC2086  # $DC and $APPS must word-split: one holds the compose
            # command prefix, the other the suite's list of test modules.
            timeout --signal=INT --kill-after=60s "${SUITE_TIMEOUT:-45m}" \
              $DC exec -T django bash -lc "cd /usr/src/geonode && ./tests/test.sh $APPS --durations 30 --failfast" </dev/null
            RC=$?
            set -e
            case $RC in
              0)   STATUS="PASS" ;;
              124) STATUS="TIMEOUT"; FAILED=1 ;;
              *)   STATUS="FAIL"; FAILED=1 ;;
            esac
            ELAPSED=$(( $(date +%s) - START ))
            echo "::endgroup::"
            echo "$STATUS  $NAME (${ELAPSED}s)"
            SUMMARY="$SUMMARY| $NAME | $STATUS | ${ELAPSED}s |"$'\n'
          done <<< "$SUITES"

          {
            echo "## Test suite results"
            echo
            echo "| Suite | Result | Duration |"
            echo "|-------|--------|----------|"
            printf '%s' "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $FAILED

      # always(): a failing suite is exactly when the coverage of the changed lines is worth seeing,
      # and this step must run before the stack is torn down.
      - name: Collect coverage
        if: always()
        run: |
          DC="docker compose --env-file .env_test -f docker-compose-test.yml"
          $DC exec -T django bash -lc '
            cd /usr/src/geonode
            # Nothing to combine if the suites never got far enough to emit a data file.
            ls .coverage.* >/dev/null 2>&1 || { echo "no coverage data produced"; exit 0; }
            coverage combine
            coverage xml -o coverage.xml' </dev/null
          $DC cp django:/usr/src/geonode/coverage.xml coverage.xml || echo "no coverage.xml produced"

      - name: Report diff coverage
        if: always()
        run: |
          [ -f coverage.xml ] || { echo "no coverage.xml, skipping diff coverage"; exit 0; }
          pip install --quiet diff-cover
          git fetch --no-tags --depth=0 origin main
          # Report-only for now: no --fail-under, so this annotates the pull request without
          # blocking it. Raise it to a threshold once real numbers are known.
          diff-cover coverage.xml \
            --compare-branch=origin/main \
            --src-roots . \
            --markdown-report diff-cover.md \
            --diff-range-notation '..' || true
          {
            echo "## Diff coverage"
            echo
            cat diff-cover.md 2>/dev/null || echo "diff-cover produced no report"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            diff-cover.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v2

      - name: Stop the stack
        if: always()
        # -v is safe here: an ephemeral CI runner owns these volumes exclusively.
        run: docker compose --env-file .env_test -f docker-compose-test.yml down -v
