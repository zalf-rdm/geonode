name: GeoNode Test Suites

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------
  # BUILD DOCKER IMAGES ONCE AND SHARE AS ARTIFACTS
  # -------------------------------------------------
  build_images:
    name: Build and export Docker images
    runs-on: ubuntu-24.04
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build all services (Docker Compose v2)
        run: docker compose --env-file .env_test -f docker-compose-test.yml build --progress plain

      - name: Save built Docker images
        run: |
          mkdir -p docker_images
          docker save -o docker_images/django.tar geonode/geonode:latest-ubuntu-24.04

      - name: Upload Docker images as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: docker_images
          retention-days: 1

  # -------------------------------------------------
  # TEST SUITES
  # -------------------------------------------------
  smoke:
    uses: ./.github/workflows/run-test-suite.yml
    needs: build_images
    secrets: inherit
    with:
      suite_name: "Smoke Tests"
      # geonode.tests.test_load_thesaurus is included deliberately: it lives in geonode/tests/
      # and is not part of any GEONODE_APPS-derived selection, so nothing else would run it.
      test_command: >
        ./tests/test.sh geonode.tests.smoke geonode.tests.test_rest_api geonode.tests.test_search
        geonode.tests.test_utils geonode.tests.test_headers geonode.tests.test_load_thesaurus
        --durations 30 --failfast

  zalf:
    uses: ./.github/workflows/run-test-suite.yml
    needs: [ build_images, smoke ]
    secrets: inherit
    with:
      suite_name: "ZALF Tests"
      # geonode.zalf is attached via INSTALLED_APPS += (...), not GEONODE_APPS, so the
      # upstream-style selections below never pick it up. Without this job the fork's own
      # code (DOI/DataCite/publish workflow) would have no CI coverage at all.
      test_command: >
        ./tests/test.sh geonode.zalf --durations 30 --failfast

  main:
    uses: ./.github/workflows/run-test-suite.yml
    needs: [ build_images, smoke ]
    secrets: inherit
    with:
      suite_name: "Main Tests"
      test_command: >
        TESTS=$(python -c 'from geonode import settings; print(" ".join([a + ".tests"
        for a in settings.GEONODE_APPS if "security" not in a and "geoserver" not in a and "upload" not in a]))') &&
        ./tests/test.sh $TESTS --durations 30 --failfast

  security:
    uses: ./.github/workflows/run-test-suite.yml
    needs: [ build_images, smoke ]
    secrets: inherit
    with:
      suite_name: "Security Tests"
      test_command: >
        TESTS=$(python -c 'from geonode import settings; print(" ".join([a + ".tests"
        for a in settings.GEONODE_APPS if "security" in a]))') &&
        ./tests/test.sh $TESTS --durations 30 --failfast

  gis_backend:
    uses: ./.github/workflows/run-test-suite.yml
    needs: [ build_images, smoke ]
    secrets: inherit
    with:
      suite_name: "GIS Backend Tests"
      test_command: >
        TESTS=$(python -c 'from geonode import settings; print(" ".join([a + ".tests"
        for a in settings.GEONODE_APPS if "geoserver" in a]))') &&
        ./tests/test.sh $TESTS --durations 30 --failfast

  rest_apis:
    uses: ./.github/workflows/run-test-suite.yml
    needs: [ build_images, smoke ]
    secrets: inherit
    with:
      suite_name: "REST API Tests"
      test_command: >
        ./tests/test.sh geonode.api.tests geonode.base.api.tests geonode.layers.api.tests
        geonode.maps.api.tests geonode.documents.api.tests geonode.geoapps.api.tests
        --durations 30 --failfast

  csw:
    uses: ./.github/workflows/run-test-suite.yml
    needs: [ build_images, smoke ]
    secrets: inherit
    with:
      suite_name: "CSW Tests"
      test_command: >
        ./tests/test.sh geonode.tests.csw geonode.catalogue.backends.tests --durations 30 --failfast

  upload:
    uses: ./.github/workflows/run-test-suite.yml
    needs: [ build_images, smoke ]
    secrets: inherit
    with:
      suite_name: "Upload Tests"
      test_command: >
        ./tests/test.sh geonode.upload --durations 30 --failfast

  # -------------------------------------------------
  # CLEANUP
  # -------------------------------------------------
  cleanup:
    name: Cleanup Artifacts
    needs: [ smoke, zalf, main, security, gis_backend, rest_apis, csw, upload ]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Delete the shared docker image artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: docker-images
          failOnError: false
