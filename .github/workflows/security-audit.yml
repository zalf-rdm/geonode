name: Security Audit

# Scope: the GeoNode image this repository builds, and nothing else. Two layers, because neither
# sees the other's packages:
#   * pip-audit -- the Python distributions installed in the image.
#   * Trivy     -- the image's OS packages (apt), which is where the base image's CVEs live.
# CVE-2026-111497 (HTTP2Shell) sat in the second layer and in a wheel's statically linked copy, so a
# Python-level audit alone would have reported nothing. Deployment of this image is configured
# elsewhere (geonode-k8s), so auditing other services belongs there, not here.

on:
  schedule:
    # Mondays, 05:17 UTC: early enough that the result is waiting at the start of the week.
    - cron: "17 5 * * 1"
  pull_request:
    branches: [ main ]
    paths:
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'security/**'
      - '.github/workflows/security-audit.yml'
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Audit the image built from the Dockerfile
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A pull request is audited against its own build. The scheduled run rebuilds from scratch
      # instead: its whole purpose is to re-resolve apt and PyPI, which a restored cache would skip.
      - name: Build the image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: geonode-audit:local
          build-args: |
            PYTHON_DEPENDENCY_CACHE_BUST=${{ github.run_id }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha

      # Auditing the installed environment, not pyproject.toml: `pip-audit -r` re-resolves the
      # dependency tree and dies building GDAL from source, and the git-pinned pycsw and
      # importer-datapackage have no release to resolve against.
      - name: Run pip-audit inside the image
        run: |
          # pip-audit exits non-zero whenever it finds anything at all, and the baseline gate below
          # is what decides pass/fail -- so a finding must not fail this step. The json.load keeps
          # `|| true` from masking a real breakage (failed pip install, truncated or empty report),
          # which would otherwise sail through as a pass.
          docker run --rm --entrypoint bash geonode-audit:local -c \
            'pip install -q --no-cache-dir pip-audit && pip-audit --progress-spinner=off -f json' \
            > pip-audit.json || true
          python3 -c "import json; json.load(open('pip-audit.json'))"

      - name: Compare against the known-advisory baseline
        run: python3 security/pip_audit_gate.py pip-audit.json --summary "$GITHUB_STEP_SUMMARY"

      # Report-only: a finding here is usually upstream's (geonode-base, or Ubuntu itself), so it is
      # a "rebuild and roll out" task rather than something this pull request can fix. The apt
      # upgrade layer in the Dockerfile is what clears those once a distro fix exists.
      - name: Scan the image for OS package CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: geonode-audit:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy.txt
          exit-code: '0'

      - name: Add the Trivy findings to the job summary
        if: always()
        run: |
          {
            echo "## Trivy: OS packages"
            echo
            echo '```'
            if [ -s trivy.txt ]; then cat trivy.txt; else echo "No fixable HIGH/CRITICAL findings."; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: |
            pip-audit.json
            trivy.txt
          retention-days: 90
