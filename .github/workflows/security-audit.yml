name: Security Audit

# Two checks, one per layer, because neither sees the other's packages:
#
#   * pip -- are the packages pinned in pyproject.toml behind a newer release in their own major?
#     This gates: a pending minor or patch update fails the job. Scope stops at the same major on
#     purpose, since .github/dependabot.yml ignores version-update:semver-major and a major is a
#     scheduled migration, not something a check can ask to have merged.
#
#   * Trivy -- the image's OS packages (apt), where the base image's CVEs live. Report-only: the
#     base is not digest-pinned and the Dockerfile's apt-get upgrade is unconditional, so an OS
#     finding is cleared by rebuilding rather than by changing anything in this repository.
#
# The pip check reads pyproject.toml and PyPI, so it needs no image and finishes in seconds. Trivy
# needs the built image, so it is a separate job -- a slow Docker build must not delay the answer
# to "is a dependency update waiting?".

on:
  schedule:
    # Mondays, 05:17 UTC: early enough that the result is waiting at the start of the week.
    - cron: "17 5 * * 1"
  pull_request:
    branches: [ main ]
    paths:
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'security/**'
      - '.github/workflows/security-audit.yml'
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-updates:
    name: Check for pip minor and patch updates
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Queries PyPI for every exact `==` pin and compares within the pinned major. Exits non-zero
      # when an update is available, and also when a pin could not be checked at all: a probe that
      # did not answer is not evidence of being up to date.
      - name: Compare the pinned versions against PyPI
        run: |
          python3 security/pip_minor_updates.py \
            --pyproject pyproject.toml \
            --summary "$GITHUB_STEP_SUMMARY"

  image:
    name: Scan the image for OS package CVEs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The scheduled run rebuilds from scratch: its whole purpose is to re-resolve apt and PyPI,
      # which a restored cache would skip. A pull request is scanned against its own cached build.
      - name: Build the image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: geonode-audit:local
          build-args: |
            PYTHON_DEPENDENCY_CACHE_BUST=${{ github.run_id }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha

      # Report-only. A finding here belongs to geonode-base or to Ubuntu itself, so it is a
      # "rebuild and roll out" task rather than something a pull request can fix.
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: geonode-audit:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy.txt
          exit-code: '0'

      - name: Add the Trivy findings to the job summary
        if: always()
        run: |
          {
            echo "## Trivy: OS packages"
            echo
            echo '```'
            if [ -s trivy.txt ]; then cat trivy.txt; else echo "No fixable HIGH/CRITICAL findings."; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy.txt
          retention-days: 90
