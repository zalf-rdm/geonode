name: Security Audit

# Two layers, because neither one sees the other's packages:
#   * pip-audit  -- Python distributions installed in the runtime image.
#   * Trivy      -- OS packages of every image docker-compose.yml pins (apt/apk).
# CVE-2026-111497 (HTTP2Shell) sat in the second layer only: a vulnerable libbrotli/brotli-libs in
# the nginx, django and geoserver images that no Python-level audit would ever have reported.

on:
  schedule:
    # Mondays, 05:17 UTC. Early enough that the result is waiting at the start of the week.
    - cron: "17 5 * * 1"
  pull_request:
    branches: [ main ]
    paths:
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'security/**'
      - '.github/workflows/security-audit.yml'
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-dependencies:
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Auditing the installed environment, not pyproject.toml: `pip-audit -r` re-resolves the
      # dependency tree and dies trying to build GDAL from source, and the git-pinned pycsw and
      # importer-datapackage have no resolvable release either. The image already has the exact
      # versions that run in production.
      - name: Resolve the GeoNode image from docker-compose.yml
        id: image
        run: |
          image=$(grep -oE '^\s+image: geonode/geonode:\S+' docker-compose.yml | head -1 | awk '{print $2}')
          test -n "$image"
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Run pip-audit inside the image
        run: |
          docker run --rm --entrypoint bash '${{ steps.image.outputs.name }}' -c \
            'pip install -q --no-cache-dir pip-audit && pip-audit --progress-spinner=off -f json' \
            > pip-audit.json

      - name: Compare against the known-advisory baseline
        run: python3 security/pip_audit_gate.py pip-audit.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the raw report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
          retention-days: 90

  discover-images:
    name: Collect pinned images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.collect.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # docker-compose.yml stays the single source of truth for what is deployed, so the scan
      # matrix cannot drift away from it when an image tag is bumped.
      - name: Collect images
        id: collect
        run: |
          images=$(grep -oE '^\s+image: \S+' docker-compose.yml | awk '{print $2}' | sort -u | jq -R . | jq -sc .)
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "$images"

  container-images:
    name: Trivy
    needs: discover-images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover-images.outputs.images) }}

    steps:
      # Report-only: these are upstream GeoNode images, so a finding is a "pull a rebuilt image or
      # patch in the Dockerfile" task, not something a pull request here can fix. Switch
      # exit-code to 1 once the standing findings in the base images are down to a reviewable few.
      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ matrix.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy.txt
          exit-code: '0'

      - name: Add the findings to the job summary
        if: always()
        run: |
          {
            echo "## Trivy: \`${{ matrix.image }}\`"
            echo
            echo '```'
            # A clean image produces an empty report; say so rather than printing nothing.
            if [ -s trivy.txt ]; then cat trivy.txt; else echo "No fixable HIGH/CRITICAL findings."; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
