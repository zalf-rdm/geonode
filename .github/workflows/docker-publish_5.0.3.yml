name: Docker Build and Push

on:
  push:
    branches: [ "main" ]
  # Weekly rebuild, a day after the security audit reports. The base image is digest-pinned, so
  # this is what actually delivers distro patches: the Dockerfile's apt upgrade layer re-resolves
  # here, and the Python layer re-resolves too via PYTHON_DEPENDENCY_CACHE_BUST.
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

env:
  BASE_VERSION: v5.0.3-zalf001
  IMAGE_NAME: zalf/geonode

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.BASE_VERSION }}.${{ github.run_number }}
            type=schedule,pattern=${{ env.BASE_VERSION }}-{{date 'YYYYMMDD'}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYTHON_DEPENDENCY_CACHE_BUST=${{ github.run_id }}
          # A scheduled run exists to re-resolve apt and PyPI, so it must not restore layers.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
