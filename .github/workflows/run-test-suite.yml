name: Run GeoNode Test Suite

on:
  workflow_call:
    inputs:
      suite_name:
        required: true
        type: string
      test_command:
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  run_suite:
    name: ${{ inputs.suite_name }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: docker_images

      - name: Load Docker images
        run: docker load -i docker_images/django.tar

      - name: Start the stack
        run: docker compose --env-file .env_test -f docker-compose-test.yml up -d

      - name: Wait for the django container to be up
        run: |
          for i in $(seq 1 60); do
            if docker compose --env-file .env_test -f docker-compose-test.yml exec -T django true 2>/dev/null; then
              echo "django container is responsive"; exit 0
            fi
            sleep 5
          done
          echo "django container never became responsive"
          docker compose --env-file .env_test -f docker-compose-test.yml ps
          exit 1

      - name: Setup test databases
        # Django needs to CREATE EXTENSION postgis, which requires superuser. Rather than granting
        # SUPERUSER to the geonode role, the databases are pre-created here by postgres with the
        # extension already installed, and owned by the geonode roles so migrations can run.
        run: |
          C="docker compose --env-file .env_test -f docker-compose-test.yml exec -T db"
          $C psql -U postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE pid <> pg_backend_pid();"
          $C psql -U postgres -c "DROP DATABASE IF EXISTS test_geonode;"
          $C psql -U postgres -c "DROP DATABASE IF EXISTS test_geonode_data;"
          $C psql -U postgres -c "CREATE DATABASE test_geonode OWNER geonode;"
          $C psql -U postgres -c "CREATE DATABASE test_geonode_data OWNER geonode_data;"
          $C psql -U postgres -d test_geonode -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          $C psql -U postgres -d test_geonode_data -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Run ${{ inputs.suite_name }}
        run: |
          docker compose --env-file .env_test -f docker-compose-test.yml exec -T django bash -s <<'BASH'
          set -euo pipefail
          ${{ inputs.test_command }}
          BASH

      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v2

      - name: Codecov
        # Non-blocking: coverage upload must never fail a test suite.
        if: ${{ always() && env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
        run: |
          docker compose --env-file .env_test -f docker-compose-test.yml exec -T \
            -e CODECOV_TOKEN="$CODECOV_TOKEN" django \
            bash -c 'bash <(curl -s https://codecov.io/bash) -t "$CODECOV_TOKEN"'

      - name: Stop the stack
        if: always()
        # -v is safe here: an ephemeral CI runner owns these volumes exclusively.
        run: docker compose --env-file .env_test -f docker-compose-test.yml down -v
