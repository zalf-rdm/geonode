# Base image refresh state, written by .github/workflows/base-image-refresh.yml.
#
# This file exists to give a rebuild something to review. The base image is digest-pinned, so when
# Ubuntu publishes security updates but upstream has not republished the base, nothing in the
# repository changes and there is no pull request to approve -- yet a rebuild would still install
# those updates. The Saturday job records what it found here, which produces a diff, which produces
# the pull request that ships the rebuild. Merging it publishes a new image; rolling that image out
# stays a separate, manual decision.
#
# Fields are informational: nothing reads them at build time.

