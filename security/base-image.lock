# Base image refresh state, written by .github/workflows/base-image-refresh.yml.
#
# This file exists to give a rebuild something to review. The base image is not digest-pinned, so a
# build re-resolves the tag and `apt-get upgrade` installs whatever Ubuntu has published -- but a
# week in which no file changes produces no build at all, and those updates reach nothing. The
# Saturday job writes what it found here, which produces a diff, which produces the pull request
# whose merge triggers the rebuild. last_refresh_run is what makes that true even on a week when
# nothing upstream moved. Rolling the resulting image out stays a separate, manual decision.
#
# Every field is informational: nothing reads them at build time, and nothing here constrains which
# OS packages a build installs. digest_at_check in particular is a record of what the tag resolved
# to on that Saturday, not a pin -- it is what lets two weeks' images be told apart after the fact.

