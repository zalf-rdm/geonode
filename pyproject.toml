    "beautifulsoup4==4.12.3",
    "hyperlink==21.0.0",
    "urllib3==2.6.3",
    "Paver==1.3.4",
    "python-slugify==8.0.4",
    "decorator==5.1.1",
    "celery==5.4.0",
    "tqdm==4.66.4",
    "Deprecated==1.2.14",
    "jsonschema==4.22.0",
    "schema==0.7.7",
    "rdflib==6.3.2",
    "smart_open==7.0.4",
    "PyMuPDF==1.26.3",
    "defusedxml==0.7.1",
    "zipstream-ng==1.8.0",

