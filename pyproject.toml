[build-system]
requires = ["setuptools>=61.0", "pip >= 19.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GeoNode"
dynamic = ["version"]
description = "Open Source, Content Management System (CMS) for geospatial data."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "GeoNode Developers", email = "dev@geonode.org"}
]
license = {text = "GPL"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: GIS",
]

# Core dependencies (consolidated from requirements.txt)
dependencies = [
    "Pillow==12.1.1",
    "lxml==5.2.1",
    "psycopg2==2.9.9",
    "Django==5.2.12",

